<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101013"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FEFAF"/>
      <stop offset="1" stop-color="#1E9C70"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner glow halo -->
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Outer ring suggesting "network / signal" -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#1B6E51" stroke-width="3" opacity="0.55"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#1B6E51" stroke-width="1" opacity="0.35"/>

  <!-- Lightning bolt — the brand mark -->
  <path d="M286,124 L188,290 L246,290 L226,388 L324,222 L266,222 Z"
        fill="url(#bolt)"
        stroke="#0a0a0a"
        stroke-width="2"
        stroke-linejoin="round"/>
</svg>
